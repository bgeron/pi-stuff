# git-cliff configuration for Bram's Pi packages.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes are generated from the package history.

"""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ({{ commit.id | truncate(length=8, end="") }})
    {% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
render_always = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = "^Add|^Create|^Introduce", group = "<!-- 0 -->Added" },
    { message = "^Fix|^Correct|^Repair", group = "<!-- 1 -->Fixed" },
    { message = "^Remove|^Delete|^Drop", group = "<!-- 2 -->Removed" },
    { message = "^Document|^Docs", group = "<!-- 3 -->Documentation" },
    { message = ".*", group = "<!-- 4 -->Changed" },
]
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
