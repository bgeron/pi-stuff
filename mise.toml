[tools]
"cargo:minijinja-cli" = "latest"
"cargo:nu" = "latest"
fd = "latest"
git-cliff = "latest"
node = "latest"
"npm:pnpm" = "latest"
pi = "latest"
shellcheck = "latest"

[settings]
env_shell_expand = false

[vars]
pi_edit_changelog_prompt = """
Research the jj/git history and repository context for the '$package' package, then rewrite $output in place as editorialized release notes for the current release. Use the existing git-cliff draft as raw material, but do not keep it verbatim. Focus on user-facing changes, group related changes, remove internal noise, and keep the result concise. You may inspect commits, diffs, and relevant source files as needed.
"""

readme_packages = '''
[
  {"readme": "pi-kagi/README.md"},
  {"readme": "pi-continue/README.md"}
]
'''

[tasks.typecheck]
description = "Typecheck the packages"
depends = ["kagi:typecheck", "continue:typecheck"]

[tasks.test]
description = "Run unit tests for the packages"
depends = ["kagi:test", "continue:test"]

[tasks.smoke]
description = "Smoke-test the packages load in pi"
depends = ["kagi:smoke", "continue:smoke"]

[tasks.check]
description = "Run typecheck, unit tests, smoke tests, and README freshness checks"
depends = [
  { task = "typecheck" },
  { task = "test" },
  { task = "smoke" },
  { task = "readme", args = ["--check"] },
  { task = "check:shell" },
  { task = "check:mise-toml-alphabetical" },
]

[tasks.clean]
description = "Remove temporary files generated by the package tasks and root node_modules"
depends = ["kagi:clean", "continue:clean"]
run = "rm -rf node_modules"

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks."check:mise-toml-alphabetical"]
description = "Check that mise tools are listed alphabetically"
shell = "nu -c"
run = '''
$env.NU_LOG_FORMAT = "%MSG%"
use std log

let tools = (open mise.toml | get tools | transpose name value | get name)
let sorted = ($tools | sort)

if $tools != $sorted {
  log error "mise.toml [tools] entries are not sorted alphabetically."
  log error ""
  log error "Current order:"
  $tools | each {|tool| log error $"  ($tool)" }
  log error ""
  log error "Expected order:"
  $sorted | each {|tool| log error $"  ($tool)" }
  exit 1
}
'''

[tasks."check:shell"]
description = "Run ShellCheck on inline shell task content from mise.toml"
shell = "nu -c"
run = '''
$env.NU_LOG_FORMAT = "%MSG%"
use std log

let tasks = (open mise.toml | get tasks)
mut checked = false

for row in ($tasks | transpose task_name task) {
  let task_name = $row.task_name
  let task = $row.task
  let shell = ($task.shell? | default "bash")

  if ($shell | str contains "nu") {
    continue
  }

  let run = ($task.run? | default null)
  if ($run == null) {
    continue
  }

  let scripts = if (($run | describe) =~ "^list") {
    $run | enumerate | each {|item| { name: $"($task_name)[($item.index)]", script: $item.item } }
  } else {
    [{ name: $task_name, script: $run }]
  }

  for script in $scripts {
    if (($script.script | describe) != "string") {
      continue
    }

    log info $"ShellCheck: ($script.name)"
    $"# mise task: ($script.name)\n($script.script)\n" | shellcheck -s bash -
    $checked = true
  }
}

if not $checked {
  log warning "No inline shell tasks found."
}
'''

[tasks.readme]
description = "Generate the root README from the MiniJinja template and package READMEs"
usage = '''
flag "--check" help="Fail if README.md is stale instead of rewriting it"
'''
run = '''
set -eu

data_file=$(mktemp)
rendered_file=$(mktemp)
cleanup() {
  rm -f "$data_file" "$rendered_file"
}
trap cleanup EXIT

README_PACKAGES=$(cat <<'JSON'
{{ vars.readme_packages }}
JSON
)
export README_PACKAGES

node > "$data_file" <<'NODE'
const fs = require("node:fs");

function demoteMarkdownHeadings(markdown, levels) {
  return markdown.replace(/^(#{1,6})([ \t].*)$/gm, (match, hashes, rest) => {
    const level = Math.min(hashes.length + levels, 6);
    return `${"#".repeat(level)}${rest}`;
  });
}

const packages = JSON.parse(process.env.README_PACKAGES ?? "[]").map((pkg) => {
  const readme = fs.readFileSync(pkg.readme, "utf8").trimEnd();
  return {
    ...pkg,
    readme,
    rootReadme: demoteMarkdownHeadings(readme, 2),
  };
});

process.stdout.write(JSON.stringify({ packages }));
NODE

minijinja-cli --format json README.md.template "$data_file" > "$rendered_file"

if [ "${usage_check:-false}" = "true" ]; then
  if ! cmp -s README.md "$rendered_file"; then
    echo "README.md is stale. Run 'mise run readme' to regenerate it." >&2
    diff -u README.md "$rendered_file" >&2 || true
    exit 1
  fi
else
  cp "$rendered_file" README.md
fi
'''

[tasks."raw-changelog"]
description = "Generate a temporary raw package release-notes draft with git-cliff"
usage = '''
arg "<package>" help="Package directory"
flag "--stdout" help="Print release-notes draft to stdout instead of writing current-release-changelog.md"
'''
run = '''
package="${usage_package?}"
config="cliff.toml"
output="$package/current-release-changelog.md"
include_path="$package/**"

if [ ! -d "$package" ]; then
  echo "Package directory not found: $package" >&2
  exit 2
fi
if [ ! -f "$config" ]; then
  echo "git-cliff config not found: $config" >&2
  exit 2
fi

if [ "${usage_stdout:-false}" = "true" ]; then
  git-cliff --config "$config" --include-path "$include_path" --unreleased
else
  git-cliff --config "$config" --include-path "$include_path" --unreleased --output "$output"
fi
'''

[tasks."pi-edit-changelog"]
description = "Launch pi interactively to research and rewrite a package release-notes draft"
usage = '''
arg "<package>" help="Package directory"
'''
depends = [{ task = "raw-changelog", args = ["{{usage.package}}"] }]
run = '''
package="${usage_package?}"
output="$package/current-release-changelog.md"

if [ ! -d "$package" ]; then
  echo "Package directory not found: $package" >&2
  exit 2
fi
if [ ! -f "$output" ]; then
  echo "Release-notes draft not found after raw-changelog task: $output" >&2
  exit 1
fi

prompt=$(cat <<EOF
{{ vars.pi_edit_changelog_prompt }}
EOF
)
pi "@$output" "$prompt"
'''

[tasks."kagi:typecheck"]
description = "Typecheck the Kagi pi extension"
depends = ["install"]
run = "pnpm --filter @bramgeron/pi-kagi run typecheck"

[tasks."kagi:test"]
description = "Run Kagi extension unit tests"
depends = ["install"]
run = "pnpm --filter @bramgeron/pi-kagi run test"

[tasks."kagi:smoke"]
description = "Smoke-test that the Kagi extension loads in pi"
depends = ["install"]
run = "pnpm --filter @bramgeron/pi-kagi run smoke"

[tasks."kagi:clean"]
description = "Remove temporary files generated by Kagi package tasks"
run = "pnpm --filter @bramgeron/pi-kagi run clean"

[tasks."kagi:check"]
description = "Run Kagi extension typecheck, unit tests, and smoke test"
depends = ["install"]
run = "pnpm --filter @bramgeron/pi-kagi run check"

[tasks."continue:typecheck"]
description = "Typecheck the Continue pi extension"
depends = ["install"]
run = "pnpm --filter @bramgeron/pi-continue run typecheck"

[tasks."continue:test"]
description = "Run Continue extension unit tests"
depends = ["install"]
run = "pnpm --filter @bramgeron/pi-continue run test"

[tasks."continue:smoke"]
description = "Smoke-test that the Continue extension loads in pi"
depends = ["install"]
run = "pnpm --filter @bramgeron/pi-continue run smoke"

[tasks."continue:clean"]
description = "Remove temporary files generated by Continue package tasks"
run = "pnpm --filter @bramgeron/pi-continue run clean"

[tasks."continue:check"]
description = "Run Continue extension typecheck, unit tests, and smoke test"
depends = ["install"]
run = "pnpm --filter @bramgeron/pi-continue run check"
